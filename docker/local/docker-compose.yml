name: database
services:
  mariadb:
    container_name: mariadb
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: pass
      MARIADB_DATABASE: factory-tycoon
      MARIADB_USER: user
      MARIADB_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      # - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - db_network

  mongodb:
    container_name: mongodb
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass
      MONGO_INITDB_DATABASE: factory-tycoon
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - db_network

  redis:
    container_name: redis
    image: redis:7.4
    restart: always
    command: redis-server --requirepass pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - db_network
      
  mariadb-backup:
    container_name: mariadb-backup
    image: mariadb:10.11
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: pass
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
    volumes:
      - ./mariadb/backups:/backups
    restart: unless-stopped
    command: >-
      sh -c '
        echo "[mariadb-backup] starting backup loop with interval ${BACKUP_INTERVAL_SECONDS:-3600}s";
        while true; do 
          if mysqladmin ping -h mariadb -u root -ppass --silent >/dev/null 2>&1; then
              ts=$$(date +%F-%H%M%S);
              outFile=/backups/factory-tycoon-$$ts.sql;
              echo "[mariadb-backup] running mysqldump to $$outFile";
              mysqldump -h mariadb -u root -ppass --all-databases > "$$outFile" && echo "[mariadb-backup] success: $$outFile" || echo "[mariadb-backup] mysqldump failed";
          else
              echo "[mariadb-backup] db not ready, will retry";
          fi;
          sleep $${BACKUP_INTERVAL_SECONDS:-3600};
        done'
    networks:
      - db_network

  mongodb-backup:
    container_name: mongodb-backup
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
    volumes:
      - ./mongodb/backups:/backups
    restart: unless-stopped
    command: >-
      sh -c '
        echo "[mongodb-backup] starting backup loop with interval ${BACKUP_INTERVAL_SECONDS:-3600}s";
        while true; do 
          if mongosh --quiet \
            --host="$$MONGO_HOST" --port="$$MONGO_PORT" \
            -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" \
            --authenticationDatabase admin \
            --eval "db.adminCommand(\"ping\")" >/dev/null 2>&1; then
              ts=$$(date +%F-%H%M%S);
              outDir=/backups/dump-$$ts;
              echo "[mongodb-backup] running mongodump to $$outDir";
              mongodump \
                --host="$$MONGO_HOST" --port="$$MONGO_PORT" \
                -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" \
                --authenticationDatabase admin \
                --out "$$outDir" && echo "[mongodb-backup] success: $$outDir" || echo "[mongodb-backup] mongodump failed";
          else
              echo "[mongodb-backup] db not ready, will retry";
          fi;
          sleep $${BACKUP_INTERVAL_SECONDS:-3600};
        done'
    networks:
      - db_network

  redis-backup:
    container_name: redis-backup
    image: redis:7.4
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: pass
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
    volumes:
      - ./redis/backups:/backups
    restart: unless-stopped
    command: >-
      sh -c '
        echo "[redis-backup] starting backup loop with interval ${BACKUP_INTERVAL_SECONDS:-3600}s";
        while true; do 
          if redis-cli -a pass ping >/dev/null 2>&1; then
              ts=$$(date +%F-%H%M%S);
              outFile=/backups/redis-$$ts.rdb;
              echo "[redis-backup] running BGSAVE";
              redis-cli -a pass BGSAVE && sleep 2 && cp /data/dump.rdb "$$outFile" && echo "[redis-backup] success: $$outFile" || echo "[redis-backup] backup failed";
          else
              echo "[redis-backup] redis not ready, will retry";
          fi;
          sleep $${BACKUP_INTERVAL_SECONDS:-3600};
        done'
    networks:
      - db_network

volumes:
  mariadb_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  db_network:
    driver: bridge
