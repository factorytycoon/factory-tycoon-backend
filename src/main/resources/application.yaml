server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: tycoon
    
  datasource:
    url: jdbc:mysql://175.114.229.158:3306/factory-tycoon2
    username: root
    password: pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  data:
    redis:
      host: 175.114.229.158
      port: 6379

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: false
    clean-disabled: false
    out-of-order: false
    table: flyway_schema_history
    create-schemas: true
    schemas: factory-tycoon

jwt:
  secret: your-secret-key-change-this-in-production-min-256-bits
  access-ttl-ms: 3600000
  refresh-ttl-ms: 86400000

