server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: tycoon
    
  datasource:
    url: ${MARIADB_URL}
    username: ${MARIADB_USERNAME}
    password: ${MARIADB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # password: ${REDIS_PASSWORD}
      

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration  # TODO: 마이그레이션 스크립트 위치 변경 가능
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    table: flyway_schema_history

jwt:
  secret: ${JWT_SECRET_KEY}
  access-ttl-ms: ${JWT_ACCESS_TTL_MS}
  refresh-ttl-ms: ${JWT_REFRESH_TTL_MS}
